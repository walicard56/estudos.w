name: Fôlego Android

on:
  push:
    paths:
      - "folego/**"
      - ".github/workflows/folego-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folego/android
    env:
      KEYSTORE_BASE64: ${{ secrets.FOLEGO_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK de teste (debug)
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: folego-apk-teste
          path: folego/android/app/build/outputs/apk/debug/app-debug.apk

      # Só roda se a chave de assinatura estiver cadastrada nos Secrets do repositório.
      - name: Preparar chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > upload-key.jks

      - name: AAB e APK de produção (assinados)
        if: env.KEYSTORE_BASE64 != ''
        env:
          FOLEGO_KEYSTORE_FILE: upload-key.jks
          FOLEGO_KEYSTORE_PASSWORD: ${{ secrets.FOLEGO_KEYSTORE_PASSWORD }}
          FOLEGO_KEY_ALIAS: ${{ secrets.FOLEGO_KEY_ALIAS }}
          FOLEGO_KEY_PASSWORD: ${{ secrets.FOLEGO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: folego-play-store
          path: |
            folego/android/app/build/outputs/bundle/release/app-release.aab
            folego/android/app/build/outputs/apk/release/app-release.apk
